[package]
name = "ethan-tkc"
version = "0.8.0"
edition = "2021"
description = "Local Claude Code and Codex usage statistics CLI"
license = "MIT"
repository = "https://github.com/hanlife02/token-check"
readme = "README.md"
keywords = ["cli", "tokens", "usage", "codex", "claude"]
categories = ["command-line-utilities"]

[lib]
name = "tokencheck"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
walkdir = "2.5"
