name: Publish crate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cargo-publish.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE"
      - "README.md"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read crate metadata
        id: crate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          package = metadata["packages"][0]
          print(f"name={package['name']}")
          print(f"version={package['version']}")
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Package crate
        run: cargo package

      - name: Check crates.io version
        id: published
        shell: bash
        run: |
          status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --output crates-response.json \
              --write-out "%{http_code}" \
              "https://crates.io/api/v1/crates/${{ steps.crate.outputs.name }}/${{ steps.crate.outputs.version }}"
          )"

          case "$status" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat crates-response.json
              echo "Unexpected crates.io status: $status" >&2
              exit 1
              ;;
          esac

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not configured." >&2
            exit 1
          fi

          cargo publish --token "$CARGO_REGISTRY_TOKEN"

      - name: Skip already-published version
        if: steps.published.outputs.exists == 'true'
        run: |
          echo "${{ steps.crate.outputs.name }} ${{ steps.crate.outputs.version }} is already published."
